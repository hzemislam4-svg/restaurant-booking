name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-ipa
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Configure Google keys
        run: |
          set -e
          MAPS_KEY="${GOOGLE_MAPS_API_KEY:-YOUR_MAPS_API_KEY}"
          CLIENT_ID="${GOOGLE_CLIENT_ID:-com.restaurantbooking.apps.googleusercontent.com}"

          # احسب المعكوس: com.googleusercontent.apps.<الرقم>
          NUMERIC="${CLIENT_ID%%.*}"
          REVERSED="com.googleusercontent.apps.${NUMERIC}"

          for cfg in Config/Debug.xcconfig Config/Release.xcconfig; do
            sed -i '' "s|^GOOGLE_MAPS_API_KEY = .*|GOOGLE_MAPS_API_KEY = ${MAPS_KEY}|" "$cfg"
            sed -i '' "s|^GOOGLE_CLIENT_ID = .*|GOOGLE_CLIENT_ID = ${CLIENT_ID}|" "$cfg"
            sed -i '' "s|^GOOGLE_REVERSED_CLIENT_ID = .*|GOOGLE_REVERSED_CLIENT_ID = ${REVERSED}|" "$cfg"
          done
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build app
        run: |
          xcodebuild \
            -project RestaurantBooking.xcodeproj \
            -scheme RestaurantBooking \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/RestaurantBooking.app"
          PAYLOAD_DIR="dist-ipa/Payload"
          mkdir -p "${PAYLOAD_DIR}"
          cp -R "${APP_PATH}" "${PAYLOAD_DIR}/"
          cd dist-ipa
          zip -r RestaurantBooking.ipa Payload
          cd ..
          echo "IPA_READY=true" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RestaurantBooking-ipa
          path: dist-ipa/RestaurantBooking.ipa
          if-no-files-found: error
          retention-days: 14
