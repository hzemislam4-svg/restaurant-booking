name: RestaurantBooking
options:
  bundleIdPrefix: com.restaurantbooking
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_LANGUAGE: ar
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_CFBundleDisplayName: "حجز المطاعم"
targets:
  RestaurantBooking:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RestaurantBooking
        excludes:
          - Info.plist
          - GoogleService-Info.plist
    preBuildScripts:
      - name: Validate Firebase config
        script: |
          if [ ! -f "$SRCROOT/RestaurantBooking/GoogleService-Info.plist" ]; then
            echo "error: GoogleService-Info.plist is missing. Add your Firebase iOS config to RestaurantBooking/GoogleService-Info.plist"
            exit 1
          fi
    buildPhases:
      - type: resources
        files:
          - RestaurantBooking/GoogleService-Info.plist
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.restaurantbooking.app
        INFOPLIST_FILE: RestaurantBooking/Info.plist
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"
        STRIP_SWIFT_SYMBOLS: YES
        COPY_PHASE_STRIP: YES
        ENABLE_BITCODE: NO
